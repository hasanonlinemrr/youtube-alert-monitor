name: Process Telegram Commands (EXTRACT / SKIP)

on:
  schedule:
    # Every 10 minutes — safe for public repos (unlimited minutes)
    # Change to "*/30 * * * *" for private repos to conserve the 2,000 min/month allowance
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram and process commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/poll_commands.py

      - name: Commit updated state files
        run: |
          git config user.name "WB Job Alert Bot"
          git config user.email "bot@wb-job-alert.local"
          git add data/state.json data/events.json data/telegram_offset.json
          git diff --staged --quiet || git commit -m "chore: update state after command processing [skip ci]"
          git push
