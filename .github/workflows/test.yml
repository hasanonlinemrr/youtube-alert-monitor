name: Test System (All Subsystems)

on:
  workflow_dispatch:
    inputs:
      test_target:
        description: "Which subsystem to test"
        type: choice
        options:
          - all
          - youtube
          - telegram
          - openrouter
          - transcript
          - extraction
        default: all
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TEST_TARGET: ${{ github.event.inputs.test_target }}
        run: python src/test_system.py --target "$TEST_TARGET"

      - name: Test summary
        run: echo "Test run complete. Check logs above for results."
