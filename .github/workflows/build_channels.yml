name: Build Channel List (channels_raw.txt → channels.csv)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/build_channels_script.py

      - name: Commit channels.csv
        run: |
          git config user.name "WB Job Alert Bot"
          git config user.email "bot@wb-job-alert.local"
          git add channels.csv
          git diff --staged --quiet || git commit -m "chore: update channels.csv from channels_raw.txt"
          git push

      - name: Summary
        run: |
          echo "## Channel Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f channels.csv ]; then
            COUNT=$(tail -n +2 channels.csv | wc -l)
            echo "✅ **$COUNT channels** resolved and saved to channels.csv" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ channels.csv was not created — check logs" >> $GITHUB_STEP_SUMMARY
          fi
