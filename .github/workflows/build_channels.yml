name: Build Channel List (channels_raw.txt → channels.csv)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve channels
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python src/build_channels_script.py

      - name: Commit channels and validation report
        run: |
          git config user.name "WB Job Alert Bot"
          git config user.email "bot@wb-job-alert.local"
          git add channels.csv channels_validation.csv
          git diff --staged --quiet || git commit -m "chore: update channels.csv and channels_validation.csv"
          git push

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-validation-reports
          path: |
            channels.csv
            channels_validation.csv
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "## Channel Validation & Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f channels.csv ]; then
            RESOLVED=$(tail -n +2 channels.csv | wc -l)
            echo "✅ **$RESOLVED channels** resolved and saved to \`channels.csv\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ \`channels.csv\` was not created" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f channels_validation.csv ]; then
            TOTAL=$(tail -n +2 channels_validation.csv | wc -l)
            UNRESOLVED=$(grep -c ",UNRESOLVED," channels_validation.csv || true)
            echo "📊 **Total evaluated:** $TOTAL | **Unresolved:** $UNRESOLVED" >> $GITHUB_STEP_SUMMARY
            echo "📄 Check \`channels_validation.csv\` in the repository for reasons on all unresolved channels." >> $GITHUB_STEP_SUMMARY
          fi
